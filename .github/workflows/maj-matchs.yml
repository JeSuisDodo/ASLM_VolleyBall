# Met à jour les matchs du site une fois par jour.
name: Mise à jour des matchs

on:
  schedule:
    - cron: "17 5 * * *"   # tous les jours vers 7 h (heure de Paris), une seule fois
  workflow_dispatch:       # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write

jobs:
  maj:
    runs-on: ubuntu-latest
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASS: ${{ secrets.FTP_PASS }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Lire les résultats sur le site de la FFvolley
        run: python3 maj_matchs.py

      - name: Enregistrer matchs.json dans le dépôt
        run: |
          git config user.name "maj-matchs"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add matchs.json
          git diff --cached --quiet || (git commit -m "Matchs : mise à jour du $(date +%F)" && git push)

      - name: Envoyer matchs.json sur l'hébergement OVH (FTP)
        if: env.FTP_HOST != ''
        run: curl -sS --ftp-create-dirs -T matchs.json "ftp://${FTP_HOST}/www/matchs.json" --user "${FTP_USER}:${FTP_PASS}"
